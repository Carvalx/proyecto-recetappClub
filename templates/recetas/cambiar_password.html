{% extends 'base.html' %}
{% block title %}Cambiar contrase&ntilde;a{% endblock %}

{% block content %}
<div class="form-wrapper">
    <div class="form-card">
        <h2>Cambiar contrase&ntilde;a</h2>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-field">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <p class="form-error">{{ field.errors|join:", " }}</p>
                {% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="form-btn">Actualizar contrase&ntilde;a</button>
        </form>
        <a href="{% url 'perfil' %}" class="form-cancelar">Cancelar</a>
    </div>
</div>
{% endblock %}
