{% extends 'base.html' %}
{% block title %}Eliminar receta{% endblock %}

{% block content %}
<div style="max-width:400px;margin:60px auto;text-align:center;background:white;padding:32px;border-radius:12px;box-shadow:0 2px 16px rgba(0,0,0,0.1);">
    <h2>¿Eliminar "{{ receta.titulo }}"?</h2>
    <p style="color:#666;margin:16px 0;">Esta acción no se puede deshacer.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" style="background:#e53935;color:white;border:none;padding:10px 24px;border-radius:6px;cursor:pointer;margin-right:12px;">Sí, eliminar</button>
        <a href="{% url 'detalle_receta' receta.pk %}" style="background:#eee;color:#333;padding:10px 24px;border-radius:6px;text-decoration:none;">Cancelar</a>
    </form>
</div>
{% endblock %}
